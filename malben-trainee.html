<title>Malben Trainee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: minimal. Beige ground, Malben green for the logo and anything you can tap; no borders, just lighter panels */
:root {
  --bg: #E3DABB;
  --paper: #EEE8D3;
  --ink: #1c2b2b;
  --muted: #5b625c;
  --line: #cfc5a2;
  --brand: #005357;
  --accent: #005357;
  --accent-ink: #F3EEDD;
  --accent-soft: #d6ccA8;
  --todo-bg: #f4e7a6;
  --todo-ink: #5a4700;
  --font: "Assistant", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d2224; --paper: #132e30; --ink: #ece4c8; --muted: #a3aa9f; --line: #24423f;
    --brand: #E3DABB; --accent: #E3DABB; --accent-ink: #0d2224; --accent-soft: #1d3c3d;
    --todo-bg: #3d3414; --todo-ink: #f1dd8e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d2224; --paper: #132e30; --ink: #ece4c8; --muted: #a3aa9f; --line: #24423f;
  --brand: #E3DABB; --accent: #E3DABB; --accent-ink: #0d2224; --accent-soft: #1d3c3d;
  --todo-bg: #3d3414; --todo-ink: #f1dd8e; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.55; }
h1, h2, h3 { font-weight: 700; text-wrap: balance; margin: 0; line-height: 1.2; color: var(--brand); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-in, main { max-width: 1040px; margin-inline: auto; padding-inline: 16px; }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 12px; margin-inline-end: auto; color: var(--brand); }
.logo { height: 26px; width: auto; display: block; }
.brand small { font-size: 13px; color: var(--muted); letter-spacing: .06em; padding-inline-start: 12px; border-inline-start: 1px solid var(--line); }
.seg { display: inline-flex; gap: 18px; }
.seg button { border: 0; background: transparent; padding: 4px 0; font-weight: 600; font-size: 16px; color: var(--muted); border-bottom: 2px solid transparent; }
.seg button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.lang { border: 0; background: transparent; padding: 4px 0; font-weight: 600; font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }

main { padding-block: 28px 64px; }

/* Drinks */
.drinks { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; align-items: start; }
.list { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); }
.list h2 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 12px 8px; }
.item { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; text-align: start; background: transparent; border: 0; border-radius: var(--r); padding: 8px 12px; }
.item span:last-child { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.item:hover { background: var(--paper); }
.item[aria-current="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.item[aria-current="true"] span:last-child { color: var(--accent-ink); opacity: .8; }

.card { background: var(--paper); border-radius: var(--r); padding: 28px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.card-head h2 { font-size: 32px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 7px 18px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .35; cursor: default; }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }

.specs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 22px 0 8px; border-block: 1px solid var(--line); }
.spec { padding: 12px 14px; border-inline-start: 1px solid var(--line); min-width: 0; }
.spec:first-child { border-inline-start: 0; padding-inline-start: 0; }
.spec dt { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.spec dd { margin: 2px 0 0; font-weight: 700; font-variant-numeric: tabular-nums; }

.steps { list-style: none; padding: 0; margin: 22px 0 0; display: flex; flex-direction: column; gap: 14px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; counter-increment: s; }
.steps li::before { content: counter(s); font-weight: 700; font-size: 15px; color: var(--accent); text-align: center; border: 1.5px solid var(--accent); border-radius: 50%; width: 28px; height: 28px; line-height: 25px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.steps li p { margin: 2px 0 0; }
.steps h3 { font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 10px 0 -4px; }
.steps li.group { display: block; counter-increment: none; }
.steps li.group::before { content: none; }

.tip { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
.tip strong { color: var(--accent); }

/* Step mode */
.focus { margin-top: 22px; display: flex; flex-direction: column; gap: 18px; min-height: 240px; }
.focus-count { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; letter-spacing: .06em; }
.focus-text { font-size: 26px; line-height: 1.35; margin: 0; flex: 1; max-width: 32ch; }
.focus-nav { display: flex; gap: 10px; justify-content: space-between; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }

/* Branches */
.branch-pick { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
.sheet { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.sheet .card { padding: 22px; }
.sheet .wide { grid-column: 1 / -1; }
.sheet h3 { font-size: 18px; margin-bottom: 10px; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; }
.facts dt { color: var(--muted); font-weight: 600; }
.facts dd { margin: 0; }
.hours { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.hours th { font-weight: 400; text-align: start; padding: 0 16px 2px 0; padding-inline: 0 16px; }
.hours td { padding: 0 0 2px; text-align: end; }
.checks { margin: 0; padding-inline-start: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.todo { background: var(--todo-bg); color: var(--todo-ink); padding: 0 6px; border-radius: 4px; font-style: italic; }
.phases { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 22px; counter-reset: ph; }
.phases > li { counter-increment: ph; position: relative; padding-inline-start: 42px; display: flex; flex-direction: column; align-items: stretch; gap: 8px; min-width: 0; }
.phases > li::before { content: counter(ph); position: absolute; inset-inline-start: 0; top: 0; font-weight: 700; font-size: 15px; color: var(--accent-ink); background: var(--accent); text-align: center; border-radius: 50%; width: 28px; height: 28px; line-height: 28px; font-variant-numeric: tabular-nums; }
.phases > li > * { min-width: 0; }
.phases h4 { margin: 2px 0 0; font-size: 17px; color: var(--brand); display: flex; align-items: center; gap: 8px; }
.phases + * { margin-top: 0; }
.checks li.plain { list-style: none; }
.pick { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; align-items: center; margin: 8px 0 2px; }
.pick dt { font-size: 14px; color: var(--muted); font-weight: 600; }
.pick dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.sub { margin: 6px 0 0; padding-inline-start: 1.1em; display: flex; flex-direction: column; gap: 4px; list-style: circle; }
.tag { font-size: 11px; letter-spacing: .1em; border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; padding: 0 6px; }
.rule { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 15px; color: var(--muted); margin-inline-start: -1.3em; }
.chip { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 12px; font-size: 14px; }
.chip.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; background: var(--accent); color: var(--accent-ink); padding: 1px 8px; border-radius: 4px; letter-spacing: .12em; }
.small { font-size: 14px; color: var(--muted); margin: 4px 0 0; }
.flush { margin: 0 0 6px; }
.btn.sm { padding: 5px 14px; font-size: 14px; align-self: flex-start; }
.tbl { overflow-x: auto; }
.bake { border-collapse: collapse; width: 100%; font-size: 15px; }
.bake th { text-align: start; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 12px 6px 0; padding-inline: 0 12px; border-bottom: 1px solid var(--line); }
.bake td { padding: 8px 0; padding-inline-end: 12px; border-bottom: 1px solid var(--line); }
.bake td.num { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; }
.specs.three { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 0; }
.pastry-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.pastry-head h3 { margin: 0; }
.pill { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 12px; font-size: 14px; font-weight: 700; white-space: nowrap; }
.panel-note { margin: 0 0 4px; }
.oven-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 10px; }
.oven-head h3 { margin: 0; }
.toggle { display: inline-flex; background: var(--bg); border-radius: 999px; padding: 3px; gap: 2px; }
.toggle button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 15px; color: var(--muted); }
.toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.sub-h { margin: 18px 0 10px; font-size: 15px; color: var(--brand); }
.panel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 28px; }
.pgroup h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pgroup dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 12px; margin: 0; align-items: start; }
.pgroup dd { margin: 0; min-width: 0; }
.keycap { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 30px; padding: 0 9px; border-radius: 6px; background: #1b1b1b; color: #f2f2f2; font-weight: 700; font-size: 13px; letter-spacing: .04em; white-space: nowrap; }
.keycap.ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
dt.warn .keycap { background: var(--todo-ink); color: var(--todo-bg); }
dd.warn { font-weight: 700; color: var(--todo-ink); background: var(--todo-bg); padding: 4px 8px; border-radius: 4px; }
.note { font-size: 15px; color: var(--muted); margin: 0 0 16px; max-width: 70ch; }

@media (max-width: 760px) {
  .drinks { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .list { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .list h2 { display: none; }
  .item { flex: 0 0 auto; background: var(--paper); border-radius: 999px; padding: 6px 14px; }
  .item span:last-child { display: none; }
  .specs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .specs.three .spec:nth-child(3) { border-inline-start: 1px solid var(--line); padding-inline-start: 14px; }
  .specs.three .spec:nth-child(n+3) { border-top: 0; }
  .specs.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .spec:nth-child(3) { border-inline-start: 0; padding-inline-start: 0; }
  .spec:nth-child(n+3) { border-top: 1px solid var(--line); }
  .sheet { grid-template-columns: minmax(0, 1fr); }
  .panel { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 20px; }
  .card-head h2 { font-size: 26px; }
  .focus-text { font-size: 22px; }
  .logo { height: 22px; }
}
@media (prefers-reduced-motion: no-preference) {
  .focus-text { animation: in .2s ease-out; }
  @keyframes in { from { opacity: .4; transform: translateY(4px); } }
}
</style>

const store = {
  get(k, d) { try { const v = localStorage.getItem("malben." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("malben." + k, JSON.stringify(v)); } catch (e) {} }
};
const S = {
  lang: store.get("lang", "he"),
  view: store.get("view", "drinks"),
  drink: store.get("drink", "espresso"),
  branch: store.get("branch", 0),
  oven: store.get("oven", 0),
  stepMode: false,
  step: 0
};
const t = (o) => o[S.lang];
const txt = (o) => o.todo ? `<span class="todo">${t(o)}</span>` : t(o);
const app = document.getElementById("app");

function save() { ["lang", "view", "drink", "branch", "oven"].forEach(k => store.set(k, S[k])); }

function renderBar() {
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === "he" ? "rtl" : "ltr";
  document.getElementById("tag").textContent = t(UI.tag);
  const lb = document.getElementById("lang");
  lb.textContent = S.lang === "he" ? "English" : "עברית";
  lb.setAttribute("lang", S.lang === "he" ? "en" : "he");
  document.getElementById("views").innerHTML = ["drinks", "baking", "branches"].map(v =>
    `<button data-view="${v}" aria-pressed="${S.view === v}">${t(UI[v])}</button>`).join("");
}

function renderDrinks() {
  const d = DRINKS.find(x => x.id === S.drink) || DRINKS[0];
  const steps = d.steps.filter(s => !s.group);
  const list = DRINKS.map(x =>
    `<button class="item" data-drink="${x.id}" aria-current="${x.id === d.id}"><span>${t(x.name)}</span><span>${t(x.cup)}</span></button>`).join("");
  const specs = ["cup", "coffee", "milk", "time"].map(k =>
    `<div class="spec"><dt>${t(UI[k])}</dt><dd>${t(d[k])}</dd></div>`).join("");

  let body;
  if (S.stepMode) {
    const i = Math.min(S.step, steps.length - 1);
    const last = i === steps.length - 1;
    body = `<div class="focus" aria-live="polite">
      <div class="focus-count">${t(UI.step)} ${i + 1} ${t(UI.of)} ${steps.length}</div>
      <p class="focus-text">${txt(steps[i])}</p>
      <div class="dots">${steps.map((_, j) => `<i class="${j <= i ? "on" : ""}"></i>`).join("")}</div>
      <div class="focus-nav">
        <button class="btn ghost" data-step="-1" ${i === 0 ? "disabled" : ""}>${t(UI.back)}</button>
        <button class="btn" data-step="${last ? "done" : 1}">${last ? t(UI.done) : t(UI.next)}</button>
      </div>
    </div>`;
  } else {
    body = `<ol class="steps">${d.steps.map(s => s.group
      ? `<li class="group"><h3>${t(s)}</h3></li>`
      : `<li><p>${txt(s)}</p></li>`).join("")}</ol>
      <div class="tip"><strong>${t(UI.tip)}:</strong> ${t(d.tip)}</div>`;
  }

  app.innerHTML = `<div class="drinks">
    <nav class="list" aria-label="${t(UI.menu)}"><h2>${t(UI.menu)}</h2>${list}</nav>
    <article class="card">
      <div class="card-head">
        <h2>${t(d.name)}</h2>
        <button class="btn ghost" data-mode>${S.stepMode ? t(UI.allSteps) : t(UI.stepMode)}</button>
      </div>
      <p class="lede">${t(d.about)}</p>
      <dl class="specs">${specs}</dl>
      ${body}
    </article>
  </div>`;
}

function renderOpening(phases) {
  const rule = (r) => `<div class="rule">${r.en ? `<span>${t(r)}:</span>` : ""}
    <span class="chip"><b>${t(r.a)}</b> = ${t(UI.older)}</span><span class="chip ghost"><b>${t(r.b)}</b> = ${t(UI.newer)}</span></div>`;
  return `<ol class="phases">${phases.map(ph => `<li>
    <h4>${t(ph.title)}${ph.fifo ? ` <span class="tag">FIFO</span>` : ""}</h4>
    <ul class="checks">${ph.items.map(x => x.rule ? `<li class="plain">${rule(x)}</li>` : `<li>${txt(x)}${x.groups ? `<dl class="pick">${x.groups.map(g => `<dt>${t(g.label)}</dt><dd>${g.chips.map(c => `<span class="chip ghost">${t(c)}</span>`).join("")}</dd>`).join("")}</dl>` : ""}${x.sub ? `<ul class="sub">${x.sub.map(s => `<li>${txt(s)}</li>`).join("")}</ul>` : ""}</li>`).join("")}</ul>
    ${ph.fifo ? `<p class="small">${t(UI.fifo)}</p>` : ""}
    ${ph.bake ? bakeTable() + `<button class="btn ghost sm" data-view="baking">${t(UI.seeBaking)}</button>` : ""}

  const pick = BRANCHES.map((x, i) =>
    `<button class="btn ${i === S.branch ? "" : "ghost"}" data-branch="${i}" aria-pressed="${i === S.branch}">${t(x.name)}</button>`).join("");
  const ul = (arr, tag = "ul") => `<${tag} class="checks">${arr.map(x => `<li>${txt(x)}</li>`).join("")}</${tag}>`;
  app.innerHTML = `
    <p class="note">${t(UI.branchNote)}</p>
    <div class="branch-pick">${pick}</div>
    <div class="sheet">
      <section class="card"><h3>${t(UI.info)}</h3>
        <dl class="facts">
          <dt>${t(UI.address)}</dt><dd>${txt(b.address)}</dd>
          <dt>${t(UI.hours)}</dt><dd>${Array.isArray(b.hours) ? `<table class="hours">${b.hours.map(r => `<tr><th>${t(r.day)}</th><td dir="ltr">${r.time}</td></tr>`).join("")}</table>` : txt(b.hours)}</dd>
          <dt>${t(UI.manager)}</dt><dd>${txt(b.manager)}</dd>
        </dl>
      </section>
      <section class="card"><h3>${t(UI.equipment)}</h3>${ul(b.equipment)}</section>
      <section class="card wide"><h3>${t(UI.opening)}</h3>${b.opening[0] && b.opening[0].items ? renderOpening(b.opening) : ul(b.opening, "ol")}</section>
      <section class="card"><h3>${t(UI.closing)}</h3>${ul(b.closing, "ol")}</section>
      <section class="card"><h3>${t(UI.special)}</h3>${ul(b.special)}</section>
    </div>`;
}

function render() {
  renderBar();
  if (S.view === "branches") renderBranches();
  else if (S.view === "baking") renderBaking();
  else renderDrinks();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("button");
  if (!el) return;
  if (el.id === "lang") S.lang = S.lang === "he" ? "en" : "he";
  else if (el.dataset.view) S.view = el.dataset.view;
  else if (el.dataset.drink) { S.drink = el.dataset.drink; S.step = 0; }
  else if (el.dataset.branch) S.branch = +el.dataset.branch;
  else if (el.dataset.oven) S.oven = +el.dataset.oven;
  else if ("mode" in el.dataset) { S.stepMode = !S.stepMode; S.step = 0; }
  else if (el.dataset.step) {
    if (el.dataset.step === "done") { S.stepMode = false; S.step = 0; }
    else S.step = Math.max(0, S.step + +el.dataset.step);
  } else return;
  save();
  render();
});

render();
</script>
